name: evercare
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  file_saver: ^0.4.0
  flutter:
    sdk: flutter
  flutter_blue_plus: 2.3.11
  flutter_google_places_sdk_android: ^0.3.0
  flutter_google_places_sdk_platform_interface: ^0.4.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  image_picker: ^1.2.2
  path_provider: ^2.1.6
  permission_handler: 12.0.3
  shared_preferences: 2.5.5
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/evercare_app_icon.png
    - assets/images/
    - assets/care_book/caregivers-book.pdf
